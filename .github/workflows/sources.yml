name: sources
# Upstreams move: formulae get removed (licenses), extensions get built in. Catch it before users do.
on:
  pull_request:
    paths: ["src/rigsmith/library/**", "scripts/check_sources.py"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest  # has brew, for tap formulae and aliases
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv run python scripts/check_sources.py
