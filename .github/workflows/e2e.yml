name: e2e
# The real install → verify → reinstall (0 changes) → uninstall → verify cycle, on throwaway machines.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 0" # weekly: every preset on Ubuntu
  workflow_dispatch:
    inputs:
      args:
        description: "rigsmith filters, e.g. `-p standard` or `-c platform`"
        default: "-c platform"
      os:
        description: Where to run
        type: choice
        options: [both, ubuntu, macos]
        default: both

jobs:
  macos:
    # macOS minutes are billed 10x on private repos: pushes, PRs and manual runs only.
    if: github.event_name != 'schedule' && inputs.os != 'ubuntu'
    runs-on: macos-latest
    env:
      E2E_ARGS: ${{ inputs.args || '-p minimal -s system -s shell -s cli -s git' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: tests/e2e/run.sh

  ubuntu:
    # A bare container: exercises the Homebrew bootstrap, apt, chsh, as a non-root user (brew refuses root).
    # One job per preset keeps each container's disk use bounded.
    if: inputs.os != 'macos'
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        args: >-
          ${{ fromJSON(github.event_name == 'schedule'
          && '["-c python", "-c backend-go", "-c rust", "-c java", "-c web",
               "-c data-engineer", "-c ml-engineer", "-c platform", "-c server"]'
          || format('["{0}"]', inputs.args || '-p minimal -s system -s shell -s cli -s git')) }}
    env:
      E2E_ARGS: ${{ matrix.args }}
    steps:
      - run: apt-get update -q && apt-get install -y -q sudo curl git ca-certificates
      - uses: actions/checkout@v7
      - run: |
          useradd -m -s /bin/bash tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester
          chown -R tester "$GITHUB_WORKSPACE"
      - run: |
          su tester -c "curl -LsSf https://astral.sh/uv/install.sh | sh && \
            export PATH=\$HOME/.local/bin:\$PATH && cd '$GITHUB_WORKSPACE' && E2E_ARGS='$E2E_ARGS' tests/e2e/run.sh"
