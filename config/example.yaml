# The author's work setup: a platform/ML engineer on GCP and AWS who lives in zsh, git, helm, k9s and Claude Code.
# Built from a machine audit (installed tools and 27k commands of shell history). Synonyms stay listed as
# alternatives; the active one is pinned under answers:, and `rigsmith uninstall --inactive` removes the others.
profiles: [minimal, standard, comprehensive]

sections:
  system:
    bootstrap: {homebrew: minimal, apt-base: minimal}

  shell:
    core: {zsh: minimal, zinit: minimal}
    prompt: {p10k: minimal, starship: comprehensive}
    plugins:
      zsh-autosuggestions: minimal
      zsh-syntax-highlighting: minimal
      zsh-completions: minimal
      zsh-history-substring-search: standard
      omz-plugins: standard
    history: {atuin: minimal}
    helpers: {shell-aliases: minimal, shell-extras: comprehensive}

  terminal:
    emulator: {iterm2: minimal}
    fonts: {meslo-nf: minimal, jetbrains-nf: standard}
    theme: {catppuccin-iterm: minimal}

  desktop:
    windows: {rectangle: minimal}

  cli:
    files: {eza: minimal, eza-aliases: minimal, yazi: comprehensive}
    search: {ripgrep: minimal, ripgrep-aliases: minimal, fd: minimal, fd-aliases: minimal, fzf: minimal, fzf-functions: minimal, peco: standard}
    view-edit: {bat: minimal, bat-aliases: minimal, micro: minimal}
    navigation: {zoxide: minimal}
    data: {jq: minimal, yq: standard}
    system:
      bottom: minimal
      htop: standard
      btop: comprehensive
      sys-aliases: minimal
      dust: minimal
      duf: comprehensive

  git:
    core: {git: minimal, gh: minimal, git-aliases: minimal, git-defaults: minimal, git-identities: minimal}
    ui: {gitlens-ext: standard, git-graph-ext: standard, lazygit: comprehensive}
    diff: {delta: minimal}
    commits: {commitizen: minimal}

  dev:
    tools: {pre-commit: minimal}

  ai:
    cli: {claude-code: minimal, codex: standard}
    vscode: {claude-code-ext: minimal}

  python:
    tooling: {uv: minimal, python: minimal, ruff: minimal, ty: minimal, ipython: minimal, python-aliases: minimal}
    vscode:
      python-ext: minimal
      debugpy-ext: minimal
      ruff-ext: minimal
      ty-ext: minimal
      jupyter-ext: standard
      autodocstring-ext: standard
      python-indent-ext: standard

  containers:
    runtime: {docker-desktop: minimal, colima: comprehensive}
    tools: {docker-aliases: minimal, docker-ext: standard}

  kubernetes:
    core:
      kubectl: minimal
      kubectx: minimal
      k8s-aliases: minimal
      helm: minimal
      helm-aliases: minimal
      k8s-ext: standard
      helm-ext: standard
    ui: {k9s: minimal}
    plugins:
      krew: comprehensive
      krew-neat: comprehensive
      krew-tree: comprehensive
      krew-images: comprehensive
      krew-get-all: comprehensive
      krew-whoami: comprehensive

  cloud:
    gcp: {gcloud: minimal, gke-auth-plugin: minimal, gcp-aliases: minimal}
    aws: {awscli: minimal}

  iac:
    terraform: {terraform: standard, terraform-aliases: standard, terraform-ext: standard}

  ml:
    models: {huggingface-cli: standard}

  editor:
    vscode:
      vscode: minimal
      vscode-settings: minimal
      vscode-nerd-fonts: standard
      catppuccin-vscode: minimal
      catppuccin-icons: minimal
      errorlens: minimal
      todo-tree: standard
      better-comments: standard
      path-intellisense: standard
      project-manager: standard
      bookmarks: standard
      advanced-new-file: standard
      fileutils: standard
      coverage-gutters: standard
    config-files: {yaml-ext: minimal, toml-ext: minimal, dotenv-ext: standard}
    remote: {remote-ssh: standard, dev-containers: standard, liveshare: comprehensive}

  web:
    tooling: {node: standard}
    api: {rest-client: standard}

  data:
    files: {rainbow-csv: standard}
    databases: {sqltools: standard}

  docs:
    markdown: {markdown-all-in-one: standard, markdownlint: standard}
    diagrams: {drawio: standard}

  fun:
    terminal:
      fastfetch: comprehensive
      cmatrix: comprehensive
      lolcat: comprehensive
      figlet: comprehensive
      cowsay: comprehensive
      pipes-sh: comprehensive
      fun-aliases: comprehensive

answers:
  profile: standard
  prompt: p10k
  container-runtime: docker-desktop
  system-monitor: bottom
  terminal: iterm2
  editor: micro
  icons: "yes"
  aliases: "yes"
  tui: "yes"
  fun: "yes"
  theme: catppuccin
  work-dir: ~/Desktop/projects/work/
