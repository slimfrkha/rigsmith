      git: minimal
      gh: minimal
      git-aliases: minimal
      git-defaults: minimal
    ui:
      lazygit: minimal
      gitlens-ext: standard
      git-graph-ext: standard
      github-pr-ext: standard
    diff:
      delta: minimal

  python:
    tooling:
      uv: minimal
      python: minimal
      ruff: minimal
      ty: minimal
      python-aliases: minimal
    vscode:
      python-ext: minimal
      debugpy-ext: minimal
      ruff-ext: minimal
      ty-ext: minimal
      jupyter-ext: standard
      autodocstring-ext: standard
      python-indent-ext: standard

  containers:
