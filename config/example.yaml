# The author's work setup: a platform/GCP engineer who lives in zsh, k9s and VS Code.
# A curated fork of reference.yaml, pinned so `rigsmith install -c example -y` is reproducible.
profiles: [minimal, standard, comprehensive]

sections:
  system:
    bootstrap:
      homebrew: minimal
      apt-base: minimal

  shell:
    core:
      zsh: minimal
      zinit: minimal
    prompt:
      p10k: minimal
    plugins:
      zsh-autosuggestions: minimal
      zsh-syntax-highlighting: minimal
      zsh-completions: minimal
      zsh-history-substring-search: standard
      omz-plugins: standard
    history:
      atuin: minimal
    helpers:
      shell-aliases: minimal
      shell-functions: minimal
      shell-extras: standard

  terminal:
    emulator:
      iterm2: minimal
    fonts:
      meslo-nf: minimal
      jetbrains-nf: standard
      fira-nf: comprehensive
    theme:
      catppuccin-iterm: minimal

  cli:
    files:
      eza: minimal
      eza-aliases: minimal
      tree: minimal
      yazi: standard
    search:
      ripgrep: minimal
      ripgrep-aliases: minimal
      fd: minimal
      fd-aliases: minimal
      fzf: minimal
    view-edit:
      bat: minimal
      bat-aliases: minimal
      sd: standard
      micro: minimal
    navigation:
      zoxide: minimal
    data:
      jq: minimal
      yq: minimal
    system:
      htop: standard
      bottom: standard
      dust: standard
      duf: standard
      procs: standard
      sys-aliases: standard
    network:
      httpie: standard
      wget: minimal
    docs:
      tldr: minimal
    misc:
      watch: standard
      tokei: comprehensive
      hyperfine: comprehensive
      thefuck: comprehensive

  git:
