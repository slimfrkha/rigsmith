    logs:
      stern: minimal
    plugins:
      krew: standard
      krew-neat: standard
      krew-tree: standard
      krew-images: standard
      krew-get-all: standard
      krew-whoami: standard
    validate:
      kubeconform: comprehensive
      popeye: comprehensive
      kube-score: comprehensive
    local:
