# Managed by rigsmith (tmux-config). Put your own settings in ~/.tmux.local.conf.
set -g mouse on                                  # scroll, select panes and resize with the mouse
set -g history-limit 50000                       # long scrollback for logs
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"  # true color
set -g base-index 1                              # windows and panes count from 1, like the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10                           # no lag after Esc in vim/micro
set -g focus-events on
if-shell "test -f ~/.tmux.local.conf" "source-file ~/.tmux.local.conf"
