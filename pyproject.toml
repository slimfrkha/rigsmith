[project]
name = "rigsmith"
version = "0.4.0"
description = "Set up a fresh macOS or Linux machine from a curated, extensible library of tools and configs"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Slim Frikha" }]
keywords = ["dotfiles", "bootstrap", "setup", "homebrew", "zsh", "cli", "tui"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.15",
    "textual>=1.0",
    "rich>=13.9",
    "ruamel.yaml>=0.18",
]

[project.scripts]
rigsmith = "rigsmith.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rigsmith"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "rigsmith/_config"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM300"]
per-file-ignores = { "tests/test_tui.py" = ["F811"] }  # pytest fixture re-exported from test_runner

[tool.codespell]
skip = "uv.lock,*.svg,*.itermcolors,docs/CATALOG.md"
ignore-words-list = "iterm,ot"

[tool.pytest.ini_options]
testpaths = ["tests"]
